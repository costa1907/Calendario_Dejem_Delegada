<!--
  ============================================
  VERSÃO ATUAL: 65
  ============================================

  Histórico de versões (calendário SERVIÇO / DELEGADA / DEJEM):
  v65: corrige tela sem calendários no celular quando o arquivo é aberto
    direto (WhatsApp, Drive, Downloads): o navegador bloqueia o localStorage e
    o setItem sem try/catch derrubava o script antes do render(). Agora todas
    as gravações são protegidas; se o navegador não permitir salvar, o site
    funciona normalmente, só não guarda as alterações entre visitas.
  v64: site responsivo. (1) COMPUTADOR (tela >= 1280px): o conjunto inteiro

    ocupar 100% da largura da janela, sem barra de rolagem lateral, e
    reajusta ao redimensionar/maximizar a janela (variável CSS --s, calculada

    abas SERVIÇO/DELEGADA/DEJEM no topo, um calendário por vez com meses em
    2/3/4 colunas conforme a largura, células maiores pra toque, paleta de
    cores fixa no topo (só mostra as cores da aba ativa) e tabela de valores
    logo abaixo do calendário. Barra de menu vira grade de botões; modais
    cabem na tela. O PRINT (IMAGEM) sempre gera a imagem no layout de
    computador (escala 1), mesmo quando clicado no celular.
  v63: com o mês inteiro selecionado, o botão Apagar volta a funcionar em
    massa (limpa todos os dias do mês de uma vez) — é a única exceção; as
    demais cores continuam bloqueadas nesse tipo de seleção.
  v62: removido o modal de aviso da v61 — clicar numa cor com o mês inteiro

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SERVIÇO - DELEGADA - DEJEM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1e1e1e;
    --panel:#151515;
    --grid:#2a2a2a;
    --text:#e6e6e6;
    --muted:#9a9a9a;
    --azul:#00B0F0;
    --verde:#61F000;
    --vermelho:#FF0000;
    --roxo:#EAB308; /* nome interno da variável ficou "roxo", mas a cor agora é amarelo ouro (19x03) */
    --dourado:#FF6B00; /* nome interno da variável ficou "dourado", mas a cor agora é laranja elétrico (22x06) */
    --rosa:#1D4ED8; /* nome interno da variável ficou "rosa", mas a cor agora é azul cobalto (06x14/14x22) */
    --header:#000;
    --s:1; /* fator de escala do layout de computador (definido por applyLayout()) */
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0;
    background:var(--bg);
  }
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:manipulation; /* sem zoom por toque duplo ao marcar dias */
    -webkit-tap-highlight-color:transparent;
  }
  body{
    color:var(--text);
    font-family:Segoe UI, Arial, sans-serif;
    padding:16px;
    overflow-x:auto;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
  }
  /* Campos de digitação continuam selecionáveis normalmente. */
  input, textarea{
    user-select:text;
    -webkit-user-select:text;
  }
  /* Encolhe a barra de menu e a legenda para acompanhar exatamente a largura
     do conteúdo (calendários + tabela de valores), em vez de esticar até a
     borda da janela quando o conteúdo é mais estreito que a tela. */
  .page-wrap{
    display:block;
    width:calc(1656px * var(--s)); /* largura natural (3 calendários + totais) x escala */
    margin:0 auto;
  }
  .tabs{ display:none; }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:14px;
    background:linear-gradient(180deg, #1c1c1c, #151515);
    border:1px solid #2c2c2c;
    border-radius:12px;
    padding:10px 12px;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .year-picker{
    position:relative;
  }
  /* "Ponte" invisível cobrindo o vão entre o botão e a lista: como é um
     pseudo-elemento do próprio .year-picker, passar o mouse por cima dele
     conta como continuar em cima do menu (não dispara mouseleave), então o
     atravessar o vão não fecha mais o dropdown. */
  .year-picker::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:100%;
    height:8px;
  }
  .year-picker-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:#0d0d0d;
    color:var(--text);
    border:1px solid #3a3a3a;
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .year-picker-btn:hover{ border-color:#5a5a5a; background:#141414; }
  .year-picker-caret{
    color:var(--muted);
    transition:transform 0.15s ease;
  }
  /* Quando o dropdown está aberto, o botão e a lista formam um único bloco
     visual com o mesmo contorno azul, em vez do botão brilhar sozinho e a
     lista ficar "solta" com borda cinza. */
  .year-picker.open .year-picker-btn{
    border-color:var(--azul);
    box-shadow:0 0 0 3px rgba(0,176,240,0.18);
  }
  .year-picker.open .year-picker-caret{ transform:rotate(180deg); color:var(--azul); }
  .year-picker-menu{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    min-width:100%;
    background:#151515;
    border:1px solid #3a3a3a;
    border-radius:10px;
    padding:4px;
    box-shadow:0 10px 28px rgba(0,0,0,0.5);
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity 0.12s ease, transform 0.12s ease;
    z-index:20;
    max-height:116px; /* mostra ~3 opções por vez; o resto rola com o scroll do mouse */
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:none; /* Firefox: esconde a barra de rolagem visual, mas o scroll continua funcionando */
    -ms-overflow-style:none; /* Edge antigo/IE */
  }
  .year-picker-menu::-webkit-scrollbar{ display:none; } /* Chrome/Safari/Edge novo */
  .year-picker.open .year-picker-menu{
    border-color:var(--azul);
    box-shadow:0 0 0 3px rgba(0,176,240,0.18), 0 10px 28px rgba(0,0,0,0.5);
  }
  .year-picker-menu.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .year-picker-item{
    padding:8px 12px;
    border-radius:6px;
    font-size:14px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
    transition:background 0.1s ease, color 0.1s ease, box-shadow 0.1s ease;
  }
  .year-picker-item:hover{
    background:rgba(0,176,240,0.14);
    box-shadow:inset 0 0 0 1px rgba(0,176,240,0.45);
  }
  .year-picker-item:active{
    background:var(--azul);
    color:#04202b;
  }
  .year-picker-item.active{
    background:var(--azul);
    color:#04202b;
    box-shadow:inset 0 0 0 1px rgba(0,176,240,0.45);
  }
  .topbar button{
    position:relative;
    background:#1a1a1a;
    color:var(--text);
    border:1px solid #3a3a3a;
    border-radius:8px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.3px;
    transition:transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .topbar button:hover{
    background:#242424;
    border-color:#565656;
    transform:translateY(-1px);
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
  }
  .topbar button:active{
    transform:translateY(0);
    box-shadow:none;
    background:#161616;
  }
  .topbar button#addYearBtn{
    background:linear-gradient(180deg, #10c4ff, #00a3e0);
    color:#022634;
    border-color:#0091c7;
  }
  .topbar button#addYearBtn:hover{
    background:linear-gradient(180deg, #2ccfff, #10aee8);
    box-shadow:0 4px 14px rgba(0,176,240,0.35);
  }
  .title{
    font-size:22px;
    font-weight:800;
  }
  .title .yr{ color:var(--verde); }

  .palette{
    display:flex;
    gap:18px;
    align-items:center;
    background:linear-gradient(180deg, #171717, #131313);
    border:1px solid #2a2a2a;
    padding:12px 16px;
    border-radius:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
  }
  .palette-group{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding-right:18px;
    border-right:1px solid #2e2e2e;
  }
  .palette-group:last-child{ border-right:none; padding-right:0; }
  .group-label{
    color:var(--muted);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-right:2px;
  }
  .swatch{
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
    padding:6px 11px;
    border-radius:20px;
    border:1px solid transparent;
    font-size:12px;
    background:rgba(255,255,255,0.03);
    transition:background 0.15s ease, transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch:hover{
    background:rgba(255,255,255,0.09);
    border-color:#3a3a3a;
    transform:translateY(-1px);
  }
  .swatch:active,
  .swatch.flash{
    background:rgba(255,255,255,0.22);
    transform:scale(0.96);
  }
  .swatch .box{
    position:relative;
    width:15px;
    height:15px;
    border-radius:50%;
    border:1px solid rgba(0,0,0,0.4);
    box-shadow:0 0 0 2px rgba(255,255,255,0.05);
    transition:box-shadow 0.15s ease;
  }
  .swatch:hover .box{ box-shadow:0 0 0 3px rgba(255,255,255,0.12); }
  .swatch.apagar .box{ background:#3a3a3a; }
  /* Tipografia dos "balões" da legenda: volta ao texto simples (sem chip/
     fundo), mas toda a fonte da legenda (inclusive "Trabalho", "Folga
     Mensal", "Apagar") passa a usar Inter, mais moderna que a fonte padrão
     do resto da página. Os rótulos SERVIÇO/DELEGADA/DEJEM (.group-label)
     continuam na fonte original, como já estava bom. O valor em R$ usa o
     mesmo verde das tabelas de totais. */
  .swatch{
    font-family:'Inter', Segoe UI, Arial, sans-serif;
  }
  .swatch-label{
    color:#d8d8d8;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.1px;
  }
  .swatch-value{
    color:var(--verde);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:0.1px;
  }
  .swatch-label + .swatch-value{
    margin-left:2px;
  }

  /* Efeito "pulse ring": ao passar o mouse, dois anéis da mesma cor da
     bolinha nascem no centro (um logo atrás do outro) e se expandem
     enquanto desaparecem, repetindo em loop. Duas camadas em vez de uma só
     deixam o movimento nítido mesmo em cores mais discretas (ex: cinza do
     "Apagar"), e a opacidade/escala mais altas deixam bem visível também em
     cores fortes (ex: vermelho). */
  .swatch .box::before,
  .swatch .box::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:inherit;
    opacity:0;
    pointer-events:none;
  }
  @media (hover:hover){
    .swatch:hover .box::after{
      animation:swatchPulseRing 1.5s ease-out infinite;
    }
    .swatch:hover .box::before{
      animation:swatchPulseRing 1.5s ease-out infinite;
      animation-delay:0.6s;
    }
  }
  @keyframes swatchPulseRing{
    0%{ transform:scale(1); opacity:0.85; }
    100%{ transform:scale(3.2); opacity:0; }
  }
  /* O cinza do "Apagar" é muito próximo do fundo escuro — clareado só no
     anel do pulso, pra ficar visível, sem mudar a cor da bolinha em si. */
  .swatch.apagar .box::before,
  .swatch.apagar .box::after{
    background:#9a9a9a;
  }

  .calendars{
    display:flex;
    align-items:stretch;
    gap:calc(20px * var(--s));
  }
  .cal-col{
    flex:0 0 auto;
    position:relative; /* faz offsetTop dos filhos ser medido a partir daqui, não da página inteira */
  }
  .cal-year{
    text-align:center;
    color:#17c3ff;
    font-size:calc(26px * var(--s));
    font-weight:800;
    line-height:1.1;
  }
  .cal-col h2{
    text-align:center;
    color:#fff;
    font-size:calc(16px * var(--s));
    font-weight:700;
    margin:0 0 calc(12px * var(--s));
    letter-spacing:1px;
  }
  .months{
    display:grid;
    grid-template-columns:repeat(3, calc(144px * var(--s)));
    gap:calc(10px * var(--s));
  }
  .summaries-col{
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:0 0 calc(240px * var(--s));
    padding-top:38px; /* alinha com o topo dos meses, abaixo do título h2 */
  }
  .summaries-col .summary{
    flex:1 1 0;
    display:flex;
    flex-direction:column;
  }
  .summaries-col .summary table{ flex:1; }
  .month{
    background:var(--panel);
    border-radius:6px;
    padding:calc(6px * var(--s));
    border:2px solid transparent;
    transition:border-color 0.12s ease;
    position:relative;
  }
  .month.mes-selecionado{
    border-color:#17c3ff;
    animation:pulseMes 1.1s ease-in-out infinite;
  }
  @keyframes pulseMes{
    0%, 100% { box-shadow:0 0 0 0 rgba(23,195,255,0.45); }
    50% { box-shadow:0 0 10px 2px rgba(23,195,255,0.45); }
  }
  .month h3{
    text-align:center;
    background:var(--header);
    color:#fff;
    margin:0 0 calc(4px * var(--s));
    padding:calc(4px * var(--s)) 0;
    font-size:calc(12px * var(--s));
    border-radius:4px;
    letter-spacing:1px;
    transition:background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease, letter-spacing 0.2s ease;
  }
  .month h3.clicavel{
    cursor:pointer;
  }
  .month h3.clicavel:hover,
  .month.mes-selecionado h3{
    background:linear-gradient(135deg, #17c3ff, #0090c9);
    box-shadow:0 0 0 2px rgba(0,176,240,0.35), 0 4px 12px rgba(0,176,240,0.4);
    letter-spacing:1.6px;
  }
  .month h3.clicavel:active{
    letter-spacing:1.3px;
  }
  table.dowtable{ width:100%; border-collapse:collapse; }
  table.dowtable th{
    color:var(--verde);
    font-size:calc(10px * var(--s));
    font-weight:600;
    padding:calc(2px * var(--s)) 0;
  }
  table.dowtable td{
    text-align:center;
    font-size:calc(11px * var(--s));
    font-weight:700;
    padding:calc(3px * var(--s)) 0;
    width:14.28%;
    height:calc(18px * var(--s));
    line-height:calc(18px * var(--s));
    border-radius:3px;
    cursor:pointer;
    user-select:none;
    color:#ddd;
  }
  table.dowtable td.empty{ cursor:default; }
  table.dowtable td.selected{ outline:2px solid #fff; outline-offset:-2px; }
  /* Dias de um mês inteiramente selecionado (contorno azul ao redor do card)
     não aceitam clique individual — evita marcar/desmarcar um dia sozinho
     por engano e, ao aplicar uma cor, pintar o mês inteiro sem querer. */
  table.dowtable td.bloqueado{ cursor:default; }

  .summary{
    background:var(--panel);
    border-radius:8px;
    padding:0 calc(12px * var(--s)) calc(6px * var(--s));
    font-size:calc(12px * var(--s));
    width:100%;
    overflow:hidden;
  }
  .summary table{ width:100%; height:100%; border-collapse:collapse; table-layout:fixed; }
  .summary col.c-mes{ width:34%; }
  .summary col.c-dias{ width:32%; }
  .summary col.c-rs{ width:34%; }
  .summary caption{
    background:#000;
    color:#fff;
    font-weight:800;
    text-align:center;
    padding:calc(6px * var(--s)) 0;
    letter-spacing:1px;
    margin:0 calc(-12px * var(--s)) calc(2px * var(--s));
    width:calc(100% + 24px * var(--s));
    display:table-caption;
  }
  .summary td{ padding:calc(2px * var(--s)) calc(4px * var(--s)); color:#fff; font-weight:600; white-space:nowrap; overflow:hidden; text-align:center; }
  .summary td:first-child{ text-align:left; }
  .summary td.num{ color:#fff; font-weight:700; }
  .summary td.rs{ color:var(--verde); font-weight:700; font-size:calc(11px * var(--s)); }
  .summary tr.total td{ border-top:1px solid #444; font-weight:800; }

  .hint{
    color:var(--muted);
    font-size:12px;
    margin:6px 0 18px;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-box{
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:12px;
    padding:22px 24px;
    width:380px;
    max-width:92vw;
    max-height:90vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    transform:translateY(-10px) scale(0.97);
    transition:transform 0.15s ease;
  }
  .modal-overlay.show .modal-box{ transform:translateY(0) scale(1); }
  .modal-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    margin-bottom:12px;
  }
  .modal-icon.info{ background:rgba(0,176,240,0.15); color:var(--azul); }
  .modal-icon.warn{ background:rgba(255,192,0,0.15); color:var(--dourado); }
  .modal-title{
    font-size:16px;
    font-weight:800;
    color:#fff;
    margin:0 0 8px;
  }
  .modal-msg{
    font-size:13px;
    color:#ccc;
    line-height:1.5;
    margin:0 0 20px;
    white-space:pre-line;
  }
  .modal-input{
    width:100%;
    box-sizing:border-box;
    background:#111;
    border:1px solid #3a3a3a;
    border-radius:7px;
    color:#fff;
    font-size:14px;
    padding:9px 10px;
    margin:0 0 20px;
    outline:none;
  }
  .modal-input:focus{ border-color:var(--azul); }

  .rates-box{ width:420px; }
  .rates-group-title{
    font-size:12px;
    font-weight:800;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin:14px 0 8px;
  }
  .rates-group-title:first-child{ margin-top:0; }
  .rate-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .rate-row .rate-swatch{
    width:16px;
    height:16px;
    border-radius:4px;
    flex:0 0 auto;
  }
  .rate-row .rate-label{
    flex:1 1 auto;
    font-size:13px;
    color:#ddd;
  }
  .rate-row .rate-input{
    width:110px;
    box-sizing:border-box;
    background:#111;
    border:1px solid #3a3a3a;
    border-radius:7px;
    color:#fff;
    font-size:13px;
    padding:7px 8px;
    outline:none;
    text-align:right;
  }
  .rate-row .rate-input:focus{ border-color:var(--azul); }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .modal-actions button{
    border:none;
    border-radius:7px;
    padding:9px 18px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .modal-btn-primary{ background:var(--azul); color:#04202b; }
  .modal-btn-primary:hover{ filter:brightness(1.1); }
  .modal-btn-secondary{ background:#2c2c2c; color:#ddd; }
  .modal-btn-secondary:hover{ background:#3a3a3a; }


  /* =====================================================================
     RESPONSIVO
     O JavaScript (applyLayout) escolhe o modo e grava em <html>:
       data-layout="desktop"  -> tela >= 1280px: tudo escalado (--s) pra
                                 ocupar a largura inteira da janela.
       data-layout="stack"    -> celular/tablet: abas + um calendário por
                                 vez, meses em 2/3/4 colunas.
       data-tab="servico|delegada|dejem" -> aba ativa (só no modo stack).
     ===================================================================== */
  html[data-layout="stack"] body{
    padding:10px max(10px, env(safe-area-inset-right)) 28px max(10px, env(safe-area-inset-left));
    overflow-x:hidden;
  }
  html[data-layout="stack"] .page-wrap{
    width:100%;
    max-width:1000px;
  }

  /* barra de menu: grade de botões */
  html[data-layout="stack"] .topbar{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    padding:10px;
    margin-bottom:10px;
  }
  html[data-layout="stack"] .year-picker-btn{
    width:100%;
    justify-content:space-between;
    min-height:42px;
    font-size:15px;
  }
  html[data-layout="stack"] .topbar button:not(.year-picker-btn){
    min-height:42px;
    padding:8px 4px;
    font-size:11px;
    letter-spacing:0;
    line-height:1.2;
  }
  html[data-layout="stack"] .year-picker-item{ padding:11px 12px; }
  html[data-layout="stack"] .year-picker-menu{ max-height:140px; }

  /* abas */
  html[data-layout="stack"] .tabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:12px;
    padding:5px;
  }
  .tabs button{
    flex:1 1 0;
    background:transparent;
    color:var(--muted);
    border:none;
    border-radius:8px;
    padding:11px 4px;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .tabs button.active{
    background:linear-gradient(180deg, #10c4ff, #00a3e0);
    color:#022634;
  }

  /* paleta fixa no topo enquanto rola os meses; mostra só as cores da aba */
  html[data-layout="stack"] .palette{
    position:sticky;
    top:0;
    z-index:15;
    gap:6px;
    padding:8px;
    margin-bottom:12px;
    box-shadow:0 6px 16px rgba(0,0,0,0.55);
  }
  html[data-layout="stack"] .palette-group{ display:contents; }
  html[data-layout="stack"] .group-label{ display:none; }
  html[data-layout="stack"] .swatch{
    padding:8px 11px;
    font-size:12.5px;
    background:rgba(255,255,255,0.06);
    white-space:nowrap;
  }
  html[data-tab="servico"][data-layout="stack"] .palette-group[data-cal="delegada"],
  html[data-tab="servico"][data-layout="stack"] .palette-group[data-cal="dejem"],
  html[data-tab="delegada"][data-layout="stack"] .palette-group[data-cal="servico"],
  html[data-tab="delegada"][data-layout="stack"] .palette-group[data-cal="dejem"],
  html[data-tab="dejem"][data-layout="stack"] .palette-group[data-cal="servico"],
  html[data-tab="dejem"][data-layout="stack"] .palette-group[data-cal="delegada"]{
    display:none;
  }

  /* calendários: um por vez, conforme a aba */
  html[data-layout="stack"] .calendars{
    display:block;
  }
  html[data-layout="stack"] .cal-col{ display:none; }
  html[data-tab="servico"][data-layout="stack"] .cal-col[data-cal="servico"],
  html[data-tab="delegada"][data-layout="stack"] .cal-col[data-cal="delegada"],
  html[data-tab="dejem"][data-layout="stack"] .cal-col[data-cal="dejem"]{
    display:block;
  }
  html[data-layout="stack"] .cal-year{ font-size:24px; }
  html[data-layout="stack"] .cal-col h2{ font-size:14px; margin-bottom:10px; }
  html[data-layout="stack"] .months{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px;
  }
  html[data-layout="stack"] .month{ padding:6px; }
  html[data-layout="stack"] .month h3{
    font-size:13px;
    padding:8px 0;
    margin-bottom:4px;
  }
  html[data-layout="stack"] table.dowtable th{ font-size:11px; padding:3px 0; }
  html[data-layout="stack"] table.dowtable td{
    font-size:13px;
    padding:0;
    height:30px;
    line-height:30px;
  }

  /* tabela de valores: logo abaixo do calendário da aba (só DELEGADA/DEJEM) */
  html[data-layout="stack"] .summaries-col{
    display:block;
    height:auto !important;
    padding-top:14px !important;
    flex:none;
  }
  html[data-layout="stack"] .summaries-col .summary{
    display:none;
    height:auto !important;
    margin:0;
  }
  html[data-tab="delegada"][data-layout="stack"] .summary[data-cal="delegada"],
  html[data-tab="dejem"][data-layout="stack"] .summary[data-cal="dejem"]{
    display:block;
  }
  html[data-layout="stack"] .summary{
    font-size:14px;
    padding:0 12px 8px;
  }
  html[data-layout="stack"] .summary table{ height:auto; }
  html[data-layout="stack"] .summary caption{
    font-size:14px;
    padding:9px 0;
    margin:0 -12px 4px;
    width:calc(100% + 24px);
  }
  html[data-layout="stack"] .summary td{ padding:6px 4px; }
  html[data-layout="stack"] .summary td.rs{ font-size:13px; }

  /* modais: campos com 16px (iOS não dá zoom ao focar) e cabem na tela */
  html[data-layout="stack"] .modal-input,
  html[data-layout="stack"] .rate-row .rate-input{ font-size:16px; }
  html[data-layout="stack"] .modal-box{ padding:18px 16px; }
  html[data-layout="stack"] .modal-actions button{ padding:12px 20px; font-size:14px; }

  /* tablet / celular grande */
  @media (min-width:560px){
    html[data-layout="stack"] .months{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
    html[data-layout="stack"] .topbar{ display:flex; }
    html[data-layout="stack"] .year-picker-btn{ width:auto; min-width:96px; }
    html[data-layout="stack"] .topbar button:not(.year-picker-btn){ font-size:12.5px; padding:9px 16px; }
  }
  @media (min-width:820px){
    html[data-layout="stack"] .months{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
  }
  /* celular deitado: paleta não fica fixa (ocuparia metade da tela) */
  @media (max-height:520px){
    html[data-layout="stack"] .palette{ position:static; }
  }

  @media print{
    .topbar, .palette, .hint{ display:none; }
    body{ background:#fff; color:#000; }
    .panel, .month, .summary{ background:#fff; }
  }
</style>
</head>
<body>

<div class="page-wrap">
<div class="topbar">
  <div class="year-picker" id="yearPicker">
    <button type="button" class="year-picker-btn" id="yearPickerBtn" aria-haspopup="listbox" aria-expanded="false">
      <span id="yearPickerLabel">2026</span>
      <svg class="year-picker-caret" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="year-picker-menu" id="yearPickerMenu" role="listbox"></div>
  </div>
  <button id="addYearBtn">+ CRIAR ANO</button>
  <button id="editRatesBtn">EDITAR VALORES</button>
  <button id="printBtn">PRINT (IMAGEM)</button>
  <button id="exportBtn">EXPORTAR</button>
  <button id="importBtn">IMPORTAR</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</div>

<div class="tabs" id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="servico">SERVIÇO</button>
  <button type="button" role="tab" data-tab="delegada">DELEGADA</button>
  <button type="button" role="tab" data-tab="dejem">DEJEM</button>
</div>

<div class="palette" id="palette">
  <div class="palette-group" data-cal="servico">
    <span class="group-label">Serviço:</span>
    <div class="swatch" data-color="azul"><span class="box" style="background:var(--azul)"></span>Trabalho</div>
    <div class="swatch" data-color="verde"><span class="box" style="background:var(--verde)"></span>Folga Mensal</div>
  </div>

<script>
// Modal customizado, substitui os alert()/confirm() nativos do navegador.
const modalOverlay = document.getElementById('modalOverlay');
const modalIcon = document.getElementById('modalIcon');
const modalTitle = document.getElementById('modalTitle');
const modalMsg = document.getElementById('modalMsg');
const modalOkBtn = document.getElementById('modalOkBtn');
const modalCancelBtn = document.getElementById('modalCancelBtn');
const modalInput = document.getElementById('modalInput');

function closeModal(){
  modalOverlay.classList.remove('show');
}

function showAlert(message, title){
  return new Promise(resolve => {
    modalIcon.textContent = 'i';
    modalIcon.className = 'modal-icon info';
    modalTitle.textContent = title || 'Aviso';
    modalMsg.textContent = message;
    modalInput.style.display = 'none';
    modalCancelBtn.style.display = 'none';
    modalOkBtn.textContent = 'OK';
    modalOverlay.classList.add('show');
    const onOk = () => { closeModal(); cleanup(); resolve(true); };
    const onOverlay = (e) => { if(e.target === modalOverlay){ onOk(); } };
    function cleanup(){
      modalOkBtn.removeEventListener('click', onOk);
      modalOverlay.removeEventListener('click', onOverlay);
    }
    modalOkBtn.addEventListener('click', onOk);
    modalOverlay.addEventListener('click', onOverlay);
  });
}

function showConfirm(message, title){
  return new Promise(resolve => {
    modalIcon.textContent = '!';
    modalIcon.className = 'modal-icon warn';
    modalTitle.textContent = title || 'Confirmar';
    modalMsg.textContent = message;
    modalInput.style.display = 'none';
    modalCancelBtn.style.display = '';
    modalOkBtn.textContent = 'Confirmar';
    modalOverlay.classList.add('show');
    const onOk = () => { closeModal(); cleanup(); resolve(true); };
    const onCancel = () => { closeModal(); cleanup(); resolve(false); };
    function cleanup(){
      modalOkBtn.removeEventListener('click', onOk);
      modalCancelBtn.removeEventListener('click', onCancel);
    }
    modalOkBtn.addEventListener('click', onOk);
    modalCancelBtn.addEventListener('click', onCancel);
  });
}

// Modal com campo de número, usado para pedir o ano do novo calendário.
function showPromptYear(message, title, defaultValue){
  return new Promise(resolve => {
    modalIcon.textContent = '+';
    modalIcon.className = 'modal-icon info';
    modalTitle.textContent = title || 'Novo ano';
    modalMsg.textContent = message;
    modalInput.style.display = '';
    modalInput.value = defaultValue || '';
    modalCancelBtn.style.display = '';
    modalOkBtn.textContent = 'Criar';
    modalOverlay.classList.add('show');
    setTimeout(() => modalInput.focus(), 50);
    const onOk = () => { const v = modalInput.value; closeModal(); cleanup(); resolve(v); };
    const onCancel = () => { closeModal(); cleanup(); resolve(null); };
    const onKey = (e) => { if(e.key === 'Enter'){ onOk(); } else if(e.key === 'Escape'){ onCancel(); } };
    function cleanup(){
      modalOkBtn.removeEventListener('click', onOk);
      modalCancelBtn.removeEventListener('click', onCancel);
      modalInput.removeEventListener('keydown', onKey);
    }
    modalOkBtn.addEventListener('click', onOk);
    modalCancelBtn.addEventListener('click', onCancel);
    modalInput.addEventListener('keydown', onKey);
  });
}

// Atualiza YEARS incluindo qualquer ano extra já presente em `data` (por
// exemplo, anos criados anteriormente pelo botão "+ CRIAR ANO" e salvos no
// localStorage), mantendo tudo em ordem crescente.
function refreshYearsFromData(){
  const found = new Set(YEARS);
  Object.keys(data).forEach(k => {
    const y = parseInt(k.split('|')[1], 10);
    if(!isNaN(y)) found.add(y);
  });
  YEARS = Array.from(found).sort((a,b) => a - b);
}
refreshYearsFromData();

// Migração: nas versões antigas o calendário DELEGADA usava "vermelho" para o
// turno 06x14/14x22. Agora essa cor é exclusiva do DEJEM, então os dias antigos
// de DELEGADA pintados de vermelho passam a ser "rosa" automaticamente.
function migrateData(d){
  const out = {};
  Object.keys(d).forEach(k => {
    let v = d[k];
    if(k.startsWith('delegada|') && v === 'vermelho') v = 'rosa';
    out[k] = v;
  });
  return out;
}

function loadData(){
  let parsed = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) parsed = JSON.parse(raw);
  }catch(e){ parsed = null; }
  // Se nunca foi salvo nada (ou o que estava salvo está vazio), semeia com os
  // dados importados da planilha e já grava isso no navegador.
  if(!parsed || Object.keys(parsed).length === 0){
    const seeded = migrateData(PREFILL_DATA);
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded)); }catch(e){}
    return seeded;
  }
  return migrateData(parsed);
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}
function cellKey(calKey, year, dateStr){
  return `${calKey}|${year}|${dateStr}`;
}
function fmtDate(y,m,d){
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function fmtBRL(v){
  return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function buildMonthGrid(year, month){
  // returns array of weeks, each week array of 7 (day number or null)
  const first = new Date(year, month, 1);
  const startDow = first.getDay(); // 0=Dom
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);
  // Sempre completa até 6 semanas (42 células) para que todos os meses/anos
  // tenham exatamente a mesma altura, evitando que o calendário "pule" de
  // tamanho ao trocar de mês ou de ano.
  while(cells.length < 42) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}

function getColorFor(calKey, year, dateStr){
  return data[cellKey(calKey, year, dateStr)] || null;
}
function setColorFor(calKey, year, dateStr, color){
  const k = cellKey(calKey, year, dateStr);
  if(color) data[k] = color; else delete data[k];
}

// Gera automaticamente o calendário de SERVIÇO de um novo ano, pintando de
// azul em ciclo de "2 dias trabalha / 2 dias folga", dando continuidade
// exata à sequência do último ano já existente (sem reiniciar o ciclo na
// virada do ano).
function anoTemServico(year){
  return Object.keys(data).some(k => k.startsWith('servico|' + year + '|'));
}
function gerarServicoContinuo(newYear){
  // Encontra o último ano (menor que newYear) que já tem dados de SERVIÇO,
  // para descobrir em que ponto do ciclo 2x2 a sequência estava.
  const anteriores = YEARS.filter(y => y < newYear && anoTemServico(y));
  if(anteriores.length === 0) return false; // não há referência para continuar
  const prevYear = Math.max(...anteriores);

  // Descobre a "corrida" (run) de dias iguais (trabalho/folga) que termina
  // em 31/dez do ano anterior, para saber exatamente em que fase do ciclo
  // 2x2 o dia 1º de janeiro do novo ano deve começar.
  const isMarcado = (date) => {
    const ds = fmtDate(date.getFullYear(), date.getMonth(), date.getDate());
    return !!getColorFor('servico', date.getFullYear(), ds);
  };
  let cursor = new Date(prevYear, 11, 31);
  const statusFinal = isMarcado(cursor);
  let tamanhoCorrida = 0;
  let guard = 0;
  while(isMarcado(cursor) === statusFinal && guard < 400){
    tamanhoCorrida++;
    cursor.setDate(cursor.getDate() - 1);
    guard++;
  }

  // Máquina de estados: continua o par de 2 em 2 dias a partir da fase
  // detectada, sem resetar o ciclo na virada do ano.
  let status = statusFinal;
  let parCompleto = (tamanhoCorrida % 2 === 0); // true = próximo dia inicia um novo par (inverte a cor)
  let d = new Date(newYear, 0, 1);
  const fim = new Date(newYear, 11, 31);
  while(d <= fim){
    if(parCompleto){
      status = !status;
      parCompleto = false;
    } else {
      parCompleto = true;
    }
    if(status){
      const ds = fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
      setColorFor('servico', newYear, ds, 'azul');
    }
    d.setDate(d.getDate() + 1);
  }
  return true;
}

// Largura "natural" do modo computador (3 calendários de 452px + 3 vãos de
// 20px + coluna de totais de 240px). O fator --s escala tudo isso pra caber
// exatamente na janela.
const NATURAL_W = 1656;
const DESKTOP_MIN = 1280;   // abaixo disso usa o layout empilhado (celular/tablet)
const SCALE_MIN = 0.72;     // abaixo disso prefere rolar a deixar ilegível
const SCALE_MAX = 2.6;
const TAB_STORAGE_KEY = "cbpm_calendario_aba_v1";
let activeTab = 'servico';
try{
  const t = localStorage.getItem(TAB_STORAGE_KEY);
  if(t === 'servico' || t === 'delegada' || t === 'dejem') activeTab = t;
}catch(e){}

// forcar: 'print' -> layout de computador em escala 1 (usado pelo PRINT).
function applyLayout(forcar){
  const root = document.documentElement;
  const largura = root.clientWidth;
  const desktop = forcar === 'print' || largura >= DESKTOP_MIN;
  root.dataset.layout = desktop ? 'desktop' : 'stack';
  root.dataset.tab = activeTab;
  let s = 1;
  if(desktop && forcar !== 'print'){
    const disponivel = largura - 32; // padding lateral do body (16px de cada lado)
    s = Math.max(SCALE_MIN, Math.min(disponivel / NATURAL_W, SCALE_MAX));
  }
  root.style.setProperty('--s', s.toFixed(4));
  alignSummaries();
}

function setTab(tab){
  activeTab = tab;
  try{ localStorage.setItem(TAB_STORAGE_KEY, tab); }catch(e){}
  selection.clear(); // não deixa dias selecionados numa aba que sumiu de vista
  document.querySelectorAll('#tabs button').forEach(b => {
    const on = b.dataset.tab === tab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.documentElement.dataset.tab = tab;
  render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});

// Alinha a coluna das tabelas pixel a pixel com o calendário ao lado (só no
// modo computador): mede onde os meses começam (abaixo do título) e a altura
// de cada uma das 4 linhas de meses, e usa isso para que a divisória entre
// as tabelas DELEGADA/DEJEM caia exatamente no meio do espaço entre a 2ª e a
// 3ª linha de meses (igual ao calendário). No modo empilhado (celular) as
// tabelas ficam soltas embaixo do calendário, então só limpa os estilos.
function alignSummaries(){
  const container = document.getElementById('calendars');
  const summariesCol = container.querySelector('.summaries-col');
  if(!summariesCol) return;
  const summaries = summariesCol.querySelectorAll('.summary');

  const limpar = () => {
    summariesCol.style.height = '';
    summariesCol.style.paddingTop = '';
    summariesCol.style.gap = '';
    summaries.forEach(sm => { sm.style.flex = ''; sm.style.height = ''; });
  };
  if(document.documentElement.dataset.layout !== 'desktop'){ limpar(); return; }

  const calCol = container.querySelector('.cal-col');
  const monthsWrap = calCol ? calCol.querySelector('.months') : null;
  const monthBoxes = monthsWrap ? monthsWrap.querySelectorAll('.month') : [];
  if(!(calCol && monthsWrap && monthBoxes.length >= 6)) return;

  const topOffset = monthsWrap.offsetTop; // altura do título h2 do calendário
  const monthsHeight = monthsWrap.offsetHeight;
  const rowGap = parseFloat(getComputedStyle(monthsWrap).rowGap) || 10; // gap definido em .months (escala com --s)
  const rowHeight = (monthsHeight - rowGap * 3) / 4;
  // meio do espaço entre a linha 2 (Abril-Junho) e a linha 3 (Julho-Setembro)
  const midPoint = rowHeight * 2 + rowGap * 1.0;

  summariesCol.style.height = calCol.offsetHeight + 'px';
  summariesCol.style.paddingTop = topOffset + 'px';
  summariesCol.style.gap = rowGap + 'px';

  const [topSummary, bottomSummary] = summaries;
  if(topSummary && bottomSummary){
    topSummary.style.flex = 'none';
    topSummary.style.height = midPoint + 'px';
    bottomSummary.style.flex = 'none';
    bottomSummary.style.height = (monthsHeight - rowGap - midPoint) + 'px';
  }
}

// Reajusta ao redimensionar / girar o celular / maximizar a janela.
let layoutRaf = null;
function agendarLayout(){
  if(layoutRaf) cancelAnimationFrame(layoutRaf);
  layoutRaf = requestAnimationFrame(() => { layoutRaf = null; applyLayout(); });
}
window.addEventListener('resize', agendarLayout);
window.addEventListener('orientationchange', agendarLayout);

function render(){
  const container = document.getElementById('calendars');
  container.innerHTML = "";

  CALENDARS.forEach(cal => {
    const col = document.createElement('div');
    col.className = 'cal-col';
    col.dataset.cal = cal.key;
    col.innerHTML = `<div class="cal-year">${currentYear}</div><h2>${cal.title}</h2>`;
    const monthsWrap = document.createElement('div');
    monthsWrap.className = 'months';

    for(let m=0;m<12;m++){
      const monthDiv = document.createElement('div');
      monthDiv.className = 'month';
      monthDiv.innerHTML = `<h3>${MESES[m]}</h3>`;
      const table = document.createElement('table');
      table.className = 'dowtable';
      const thead = document.createElement('tr');
      DOW.forEach(d => { const th=document.createElement('th'); th.textContent=d; thead.appendChild(th);});
      table.appendChild(thead);

      const weeks = buildMonthGrid(currentYear, m);

      // Lista de todos os dias válidos deste mês (pra saber, antes de
      // desenhar as células, se o mês inteiro já está selecionado).
      const monthDates = [];
      weeks.forEach(week => week.forEach(day => {
        if(day !== null) monthDates.push(fmtDate(currentYear, m, day));
      }));
      const mesInteiroSelecionado = cal.key === 'servico' && monthDates.length > 0 &&
        monthDates.every(d => selection.has(cellKey(cal.key, currentYear, d)));
      if(mesInteiroSelecionado) monthDiv.classList.add('mes-selecionado');

      weeks.forEach(week => {
        const tr = document.createElement('tr');
        week.forEach(day => {
          const td = document.createElement('td');
          if(day === null){
            td.className = 'empty';
            // espaço invisível para impedir que o navegador colapse a altura
            // de uma linha inteira quando todas as células estão vazias
            td.innerHTML = '&nbsp;';
          } else {
            const dateStr = fmtDate(currentYear, m, day);
            td.textContent = day;
            td.dataset.cal = cal.key;
            td.dataset.date = dateStr;
            const color = getColorFor(cal.key, currentYear, dateStr);
            if(color){
              td.style.background = COLORS[color];
              td.style.color = (color === 'verde') ? '#111' : '#fff';
            }
            // Quando o mês inteiro está selecionado, o contorno azul ao
            // redor do mês já mostra isso — não precisa marcar dia a dia.
            if(!mesInteiroSelecionado && selection.has(cellKey(cal.key, currentYear, dateStr))){
              td.classList.add('selected');
            }
            // Com o mês inteiro selecionado, os dias individuais ficam
            // bloqueados pra clique: evita que um clique duplo (ou qualquer
            // clique) desmarque só um dia sem querer e, ao aplicar uma cor
            // pela paleta, acabe pintando o mês inteiro por engano.
            if(mesInteiroSelecionado){
              td.classList.add('bloqueado');
            } else {
              td.addEventListener('click', onDayClick);
            }
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      monthDiv.appendChild(table);
      monthsWrap.appendChild(monthDiv);

      // Clicar no título do mês seleciona/desmarca o mês inteiro de uma vez —
      // só disponível no calendário SERVIÇO.
      if(cal.key === 'servico'){
        const h3 = monthDiv.querySelector('h3');
        h3.classList.add('clicavel');
        h3.addEventListener('click', () => {
          monthDates.forEach(d => {
            const k = cellKey(cal.key, currentYear, d);
            if(mesInteiroSelecionado) selection.delete(k); else selection.add(k);
          });
          render();
        });
      }
    }

    col.appendChild(monthsWrap);
    container.appendChild(col);
  });

  // As tabelas de totais (DELEGADA e DEJEM) ficam empilhadas numa coluna à
  // parte, depois do último calendário — igual à planilha original.
  const summariesCol = document.createElement('div');
  summariesCol.className = 'summaries-col';
  CALENDARS.forEach(cal => {
    if(cal.hasTotals){
      summariesCol.appendChild(buildSummary(cal));
    }
  });
  container.appendChild(summariesCol);

  alignSummaries();
}

function buildSummary(cal){
  const wrap = document.createElement('div');
  wrap.className = 'summary';
  wrap.dataset.cal = cal.key;
  const table = document.createElement('table');
  const caption = document.createElement('caption');
  caption.textContent = cal.title;
  table.appendChild(caption);
  const colgroup = document.createElement('colgroup');
  colgroup.innerHTML = '<col class="c-mes"><col class="c-dias"><col class="c-rs">';
  table.appendChild(colgroup);

  let totalDias = 0, totalRs = 0;
  for(let m=0;m<12;m++){
    let dias = 0, rs = 0;
    const weeks = buildMonthGrid(currentYear, m);
    weeks.forEach(week => week.forEach(day => {
      if(day===null) return;
      const dateStr = fmtDate(currentYear, m, day);
      const color = getColorFor(cal.key, currentYear, dateStr);
      const calRates = RATES[cal.key];
      if(color && calRates && calRates[color] !== undefined){
        dias += 1;
        rs += calRates[color];
      }
    }));
    totalDias += dias; totalRs += rs;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${MESES_CAP[m]}</td><td class="num">${dias || 0}</td><td class="rs">${rs ? "R$ "+fmtBRL(rs) : "R$ -"}</td>`;
    table.appendChild(tr);
  }
  const totalTr = document.createElement('tr');
  totalTr.className = 'total';
  totalTr.innerHTML = `<td>Total</td><td class="num"></td><td class="rs">R$ ${fmtBRL(totalRs)}</td>`;
  table.appendChild(totalTr);

  wrap.appendChild(table);
  return wrap;
}

function onDayClick(e){
  const td = e.currentTarget;
  const key = cellKey(td.dataset.cal, currentYear, td.dataset.date);
  if(selection.has(key)){
    selection.delete(key);
    td.classList.remove('selected');
  } else {
    selection.add(key);
    td.classList.add('selected');
  }
}

// Cores permitidas em cada calendário (Apagar/limpar é sempre permitido à parte).
const CORES_PERMITIDAS = {
  servico:  ["azul", "verde"],
  delegada: ["rosa", "roxo", "dourado"],
  dejem:    ["vermelho"]
};

// Como cada calendário/atividade é chamado e quais cores ele aceita, em
// palavras, pra usar na mensagem de aviso.
const ATIVIDADE_INFO = {
  servico:  { nome: "SERVIÇO",  cores: "azul (Serviço) e verde (Folga Mensal)", plural: true },
  delegada: { nome: "DELEGADA", cores: "azul cobalto, amarelo ouro e laranja elétrico", plural: true },
  dejem:    { nome: "DEJEM",    cores: "vermelha", plural: false }
};

function corPermitidaNoCalendario(color, calKey){
  if(!color) return true; // Apagar sempre permitido
  const permitidas = CORES_PERMITIDAS[calKey] || [];
  return permitidas.includes(color);
}

// Detecta se a seleção atual é exatamente "todos os dias de um mês do
// SERVIÇO" (a seleção criada ao clicar no título do mês). Usado pra impedir
// que clicar numa cor da paleta pinte o mês inteiro de uma vez.
function selecaoEhMesInteiro(){
  if(selection.size === 0) return false;
  const partes = Array.from(selection).map(k => k.split('|'));
  const calKey = partes[0][0];
  if(calKey !== 'servico') return false;
  if(!partes.every(p => p[0] === calKey)) return false;
  const ano = partes[0][1];
  if(!partes.every(p => p[1] === ano)) return false;
  const mesesDistintos = new Set(partes.map(p => p[2].slice(0, 7)));
  if(mesesDistintos.size !== 1) return false;
  const [anoNum, mesNum] = partes[0][2].split('-').map(Number);
  const diasNoMes = new Date(anoNum, mesNum, 0).getDate();
  return selection.size === diasNoMes;
}

function applyColorToSelection(color){
  if(selection.size === 0) return;
  if(selecaoEhMesInteiro() && color){
    // Seleção de mês inteiro serve só pra destacar visualmente — não pinta
    // em massa com nenhuma cor. Só desmarca, sem avisar nada. Apagar (color
    // vazio/null) é a única exceção: continua abaixo e limpa o mês inteiro.
    selection.clear();
    render();
    return;
  }
  let bloqueados = 0;
  const calendariosBloqueados = new Set();
  selection.forEach(key => {
    const [calKey, year, dateStr] = key.split('|');
    if(!corPermitidaNoCalendario(color, calKey)){
      bloqueados++;
      calendariosBloqueados.add(calKey);
      return;
    }
    setColorFor(calKey, year, dateStr, color || null);
  });
  selection.clear();
  saveData();
  render();
  if(bloqueados > 0){
    const frases = Array.from(calendariosBloqueados).map(calKey => {
      const info = ATIVIDADE_INFO[calKey];
      const palavra = info.plural ? 'as cores' : 'a cor';
      return `a atividade ${info.nome} só aceita ${palavra} ${info.cores}`;
    });
    const msg = `Conforme a legenda, ${frases.join('; ')}.\n\n${bloqueados} dia(s) não foram alterados.`;
    showAlert(msg, 'Cor não permitida');
  }
}

// PRINT (IMAGEM): em vez de abrir o diálogo de impressão do navegador, tira
// um "print" de verdade da área dos calendários (exatamente como aparece na
// tela, com o fundo escuro e as cores), gerando um arquivo PNG para baixar
// e poder enviar pelo WhatsApp.
// Modal "EDITAR VALORES": monta um campo numérico para cada cor da DELEGADA
// e da DEJEM, pré-preenchido com o valor atual, e salva tudo em RATES ao
// clicar em Salvar.
const ratesModalOverlay = document.getElementById('ratesModalOverlay');
const ratesFields = document.getElementById('ratesFields');
const ratesSaveBtn = document.getElementById('ratesSaveBtn');
const ratesCancelBtn = document.getElementById('ratesCancelBtn');

}
document.getElementById('editRatesBtn').addEventListener('click', abrirModalValores);
ratesCancelBtn.addEventListener('click', fecharModalValores);
ratesModalOverlay.addEventListener('click', (e) => { if(e.target === ratesModalOverlay) fecharModalValores(); });
ratesSaveBtn.addEventListener('click', async () => {
  const inputs = ratesFields.querySelectorAll('.rate-input');
  let algumInvalido = false;
  inputs.forEach(input => {

  });
  if(algumInvalido){
    await showAlert('Digite apenas valores numéricos maiores ou iguais a zero.', 'Valor inválido');
    return;
  }
  saveRates();
  atualizarLegendaValores();
  fecharModalValores();
  render();
});

// Gera o "print" da área dos calendários como um canvas de alta resolução,
// usado pelo botão PRINT (IMAGEM) pra baixar o PNG.
async function gerarImagemCalendarios(){
  const alvo = document.getElementById('calendars');
  if(typeof html2canvas === 'undefined'){
    throw new Error('html2canvas indisponível');
  }
  // A imagem sempre sai no layout de computador (escala 1, os 3 calendários
  // lado a lado + valores), mesmo quando o botão é clicado no celular ou com
  // a janela em outro tamanho. Depois volta ao layout normal.
  applyLayout('print');
  try{
    return await capturarCalendarios(alvo);
  }finally{
    applyLayout();
  }
}

async function capturarCalendarios(alvo){
  // A área dos calendários é mais larga que a tela (rola para o lado), então
  // é preciso mandar o html2canvas capturar a largura/altura TOTAL do
  // conteúdo (scrollWidth/scrollHeight), não só o que está visível na janela.
  // Sem isso, a imagem sai cortada antes da coluna de valores no fim.
  const larguraTotal = alvo.scrollWidth;
  const alturaTotal = alvo.scrollHeight;
  // Celulares têm limite de tamanho de canvas: reduz a escala se a imagem
  // final passaria de ~16 milhões de pixels.
  const escala = (larguraTotal * alturaTotal * 9 > 16000000) ? 2 : 3;
  const canvas = await html2canvas(alvo, {
    backgroundColor: '#1e1e1e',
    scale: escala,
    useCORS: true,
    width: larguraTotal,
    height: alturaTotal,
    windowWidth: larguraTotal,
    windowHeight: alturaTotal,
    scrollX: 0,
    scrollY: 0
  });
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  return blob;
}

document.getElementById('printBtn').addEventListener('click', async () => {
  const btn = document.getElementById('printBtn');
  const textoOriginal = btn.textContent;
  btn.textContent = 'GERANDO...';
  btn.disabled = true;
  try{
    const blob = await gerarImagemCalendarios();
    const dataUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = `calendario_${currentYear}.png`;
    a.click();
    URL.revokeObjectURL(dataUrl);
  }catch(err){
    await showAlert('Não foi possível gerar a imagem. Tente novamente.', 'Erro');
  }finally{
    btn.textContent = textoOriginal;
    btn.disabled = false;
  }
});
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'calendario_dados.json';
  a.click();
});
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const imported = JSON.parse(reader.result);
      data = imported;
      refreshYearsFromData();
      if(!YEARS.includes(currentYear)) currentYear = YEARS[YEARS.length - 1];
      popularYearSelect();
      saveData();
      render();
      showAlert('Dados importados com sucesso.', 'Concluído');
    }catch(err){
      showAlert('Arquivo inválido.', 'Erro');
    }
  };
  reader.readAsText(file);
});

// Dropdown de ano customizado (substitui o <select> nativo, cuja lista de
// opções não podia ser estilizada para combinar com o resto do site).
const yearPicker = document.getElementById('yearPicker');
const yearPickerBtn = document.getElementById('yearPickerBtn');
const yearPickerLabel = document.getElementById('yearPickerLabel');
const yearPickerMenu = document.getElementById('yearPickerMenu');

function popularYearSelect(){
  yearPickerLabel.textContent = currentYear;
  yearPickerMenu.innerHTML = "";
  YEARS.forEach(y => {
    const item = document.createElement('div');
    item.className = 'year-picker-item' + (y === currentYear ? ' active' : '');
    item.setAttribute('role', 'option');
    item.textContent = y;
    item.addEventListener('click', () => {
      currentYear = y;
      selection.clear();
      fecharYearPicker();
      popularYearSelect();
      render();
    });
    yearPickerMenu.appendChild(item);
  });
}
function abrirYearPicker(){
  yearPickerMenu.classList.add('show');
  yearPicker.classList.add('open');
  yearPickerBtn.setAttribute('aria-expanded', 'true');
}
function fecharYearPicker(){
  yearPickerMenu.classList.remove('show');
  yearPicker.classList.remove('open');
  yearPickerBtn.setAttribute('aria-expanded', 'false');
}
popularYearSelect();
atualizarLegendaValores();
yearPickerBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if(yearPickerMenu.classList.contains('show')) fecharYearPicker(); else abrirYearPicker();
});
document.addEventListener('click', (e) => {
  if(!yearPicker.contains(e.target)) fecharYearPicker();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') fecharYearPicker();
});
// Tirar o mouse de cima do menu (botão + lista) já fecha sozinho, sem
// precisar clicar fora. Só que entre o botão e a lista existe um pequeno
// espaço vazio (o "gap" visual) que não pertence a nenhum dos dois elementos
// — ao passar o mouse rápido por ali, o navegador dispara mouseleave mesmo
// que a intenção seja só descer até a lista. Por isso o fechamento tem um
// pequeno atraso: se o mouse voltar a entrar (na lista) antes do tempo
// passar, cancela o fechamento e nada acontece.
let yearPickerCloseTimer = null;
yearPicker.addEventListener('mouseleave', () => {
  yearPickerCloseTimer = setTimeout(fecharYearPicker, 60);
});
yearPicker.addEventListener('mouseenter', () => {
  if(yearPickerCloseTimer){ clearTimeout(yearPickerCloseTimer); yearPickerCloseTimer = null; }
});

document.getElementById('addYearBtn').addEventListener('click', async () => {
  const maxAno = Math.max(...YEARS);
  const valor = await showPromptYear(
    `Digite o ano do novo calendário. O calendário de SERVIÇO será pintado automaticamente de azul, dando continuidade ao ciclo de 2 em 2 dias a partir do último ano existente (${maxAno}).`,
    'Criar novo ano',
    String(maxAno + 1)
  );
  if(valor === null) return;
  const novoAno = parseInt(valor, 10);
  if(!Number.isInteger(novoAno) || novoAno < 1900 || novoAno > 9999){
    await showAlert('Digite um ano válido.', 'Ano inválido');
    return;
  }
  if(YEARS.includes(novoAno)){
    await showAlert(`O ano ${novoAno} já existe.`, 'Ano já existe');
    return;
  }
  const gerado = gerarServicoContinuo(novoAno);
  YEARS.push(novoAno);
  YEARS.sort((a,b) => a - b);
  saveData();
  currentYear = novoAno;
  popularYearSelect();
  selection.clear();
  render();
  if(gerado){
    await showAlert(`Calendário de ${novoAno} criado. O SERVIÇO foi pintado de azul dando continuidade ao ciclo de 2 em 2 dias a partir de ${maxAno}.`, 'Concluído');
  } else {
    await showAlert(`Calendário de ${novoAno} criado em branco (não havia um ano anterior com dados de SERVIÇO para continuar a sequência).`, 'Concluído');
  }
});

document.querySelectorAll('#tabs button').forEach(b => {
  const on = b.dataset.tab === activeTab;
  b.classList.toggle('active', on);
  b.setAttribute('aria-selected', on ? 'true' : 'false');
});
applyLayout();
render();
</script>
</body>
